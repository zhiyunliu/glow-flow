services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4-alpine}
    container_name: glow-flow-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sqlserver:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2019-latest}
    container_name: glow-flow-sqlserver
    platform: linux/amd64
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-GlowFlow@123456}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "1433:1433"
    volumes:
      - ./.docker/sqlserver/data:/var/opt/mssql/data
      - ./.docker/sqlserver/log:/var/opt/mssql/log
      - ./.docker/sqlserver/secrets:/var/opt/mssql/secrets
    shm_size: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped