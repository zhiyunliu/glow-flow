  - Missing instance or node state should return glowflow.ErrStateNotFound.
  - List results should be deterministic; tests should define ordering before implementation.
  - Existing go-redis/v9 dependency remains the Redis client dependency.
  - Tests may add a lightweight Redis test helper dependency if needed, followed by go mod tidy.
