plan_id: 20260801-complete-xdb-repository
objective: Complete contrib/repository/xdb Go repository from SQL Server schema in contrib/repository/xdb/sql.mssql.sql
created_at: "2026-08-01T00:00:00+08:00"
created_by: gem-planner
status: completed
tldr: |
  Complete the XDB repository as the SQL Server-backed DataRepository adapter for ChainDefinition loading.
  Ground row models and SQL constants in sql.mssql.sql, then assemble glowflow.ChainDefinition values.
  Validate with focused xdb tests plus go test, go vet, and diagnostics.
plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 3
  risk_score: medium
quality_warnings:
  - Version selection is not explicit in DataRepository; tests must pin the expected latest active version contract using older active, newer active, and newest disabled rows.
  - SQL templates should follow glue/xdb conventions, including first-line --sql markers where applicable.
  - Existing xdb model and SQL files are skeletal; execution should avoid broad public API changes.
assumptions:
  - sql.mssql.sql is the authoritative schema for xdb row models and column names.
  - DataRepository has no version parameter, so LoadChainDefinition selects the latest active version for a chain.
  - LoadChainDefinitions returns one executable ChainDefinition per active chain using the latest active version.
  - flow_chain_version is the executable metadata source because nodes and connections reference version_id.
  - flow_chain_definition can be used for chain-level presence/status filtering but must not replace version-scoped output.
  - JSON columns extparams, layout, and layout_definition are nullable and invalid JSON should return an error.
  - SQL Server bracketed columns such as [name], [status], [operator], and [desc] require explicit aliases for mapping.
  - Public glowflow.DataRepository, ChainDefinition, NodeDefinition, and ConnectionDefinition interfaces remain unchanged.
