    title: Validate and review Redis Lua refactor
    description: Run focused and repository-level checks, then review scope, behavior, and risk before handoff.
    wave: 4
    agent: gem-reviewer
    status: pending
    covers:
      - AC7: Repository validation succeeds after the refactor.
      - AC8: Final diff is scoped to Redis adapter, tests, Lua assets, and dependency metadata only if needed.
    dependencies:
      - T3-replace-pipelines-and-methodize-helpers
    conflicts_with: []
    context_files:
      - path: defaults/state.storeage.redis.go
        description: Final Redis adapter implementation under review.
      - path: defaults/state.storeage.redis_test.go
        description: Final Redis tests under review.
      - path: defaults/*.lua
        description: Embedded Lua scripts used by save/delete operations.
